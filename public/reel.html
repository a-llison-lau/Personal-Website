<style>
/* The Reel page on its own (no 3D). With 3D, the same content hangs on the room's right wall on the landing page.
   Content styles live in pages.css; this file adds the nav and the page frame. */
:root {
  --paper: #F4EBDD;
  --ink: #1A120B;
  --soft: #7A6A5C;
  --rust: #93430F;
  --f-jost: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --f-serif: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
  --pad: max(18px, 3.2vw);
  --pad-top: max(14px, 2.4vw);
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid var(--rust); outline-offset: 4px; border-radius: 2px; }

.header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: var(--pad-top) var(--pad) 0; padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)); }
.home { justify-self: start; display: inline-flex; align-items: center; min-height: 44px; }
.home img { display: block; width: auto; height: 46px; opacity: .9; transition: transform .6s var(--ease); }
.home:hover img { transform: rotate(-8deg) scale(1.06); }
.nav ul { display: flex; gap: clamp(20px, 2.8vw, 40px); margin: 0; padding: 0; list-style: none; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; font: 500 clamp(13px, 1.1vw, 15px)/1 var(--f-jost); color: var(--ink); text-decoration: none; }
.roll { position: relative; display: inline-block; overflow: hidden; line-height: 1.3; vertical-align: middle; }
.roll > span, .roll::after { display: block; transition: transform .6s var(--ease); }
.roll::after { content: attr(data-text); position: absolute; top: 100%; left: 0; font-family: var(--f-serif); font-style: italic; color: var(--rust); }
.nav a:hover .roll > span, .nav a:hover .roll::after, .nav a:focus-visible .roll > span, .nav a:focus-visible .roll::after { transform: translateY(-100%); }
.nav a[aria-current="page"] { color: var(--rust); }

.wrap { width: min(1240px, 100%); margin: 0 auto; padding: 0 var(--pad) clamp(40px, 7vh, 72px); padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)); }
.wrap.pg { --avail-h: calc(100svh - 230px); }
@media (max-width: 960px) { .wrap.pg { --avail-h: calc(100svh - 330px); } }
.credit { margin: 0; padding: 8px var(--pad) var(--pad-top); padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); font: 500 11px/1.3 var(--f-jost); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.credit a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--rust); }

@media (max-width: 720px) {
  .header { grid-template-columns: auto 1fr; gap: 12px; }
  .nav { justify-self: end; }
  .nav ul { gap: 16px; }
  .home img { height: 38px; }
}
</style>
</head>

<header class="header">

</header>

<main class="wrap pg play">

<div class="pg-reel">
  <header class="pg-hero">
    <h1 class="pg-title" aria-label="Reel"><span style="--i:0">R</span><span style="--i:1">E</span><span style="--i:2">E</span><span style="--i:3">L</span></h1>

    <div class="pg-screen">

    </div>
  </figure>
  <section class="pg-info" aria-label="About this reel">
    <p>Renders from <a class="pg-inline" href="/nori">Nori</a>, the physically-based renderer I extended beyond ETH Zürich’s Computer Graphics course.</p>
    <a class="pg-back" href="/" data-view="home">← Back to the room</a>
  </section>
</div>
<!--/pg:reel-->
